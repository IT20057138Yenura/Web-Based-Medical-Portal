<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login | MediPortal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 10.5V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4.5C5 15.2 8.8 19 13.5 19H14v2h-2a1 1 0 0 0 0 2h4a1 1 0 0 0 0-2h-1v-2h.5c4.7 0 8.5-3.8 8.5-8.5v-1a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v1c0 3.6-2.9 6.5-6.5 6.5S9 14.1 9 10.5V6h8v4.5a1 1 0 0 0 2 0z"/></svg>
                </div>
                <span>MediPortal</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="doctors.html">Find Doctors</a></li>
                <li class="protected-nav-link" style="display: none;"><a href="dashboard.html">Dashboard</a></li>
                <li class="protected-nav-link" style="display: none;"><a href="my-appointments.html">My Appointments</a></li>
                <li class="protected-nav-link" style="display: none;"><a href="profile.html">My Profile</a></li>
            </ul>

            <div class="auth-nav">
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </header>

    <main style="padding: 60px 0; flex-grow: 1;">
        <div class="container" style="max-width: 460px;">
            <div class="card">
                <div style="text-align: center; margin-bottom: 28px;">
                    <div style="width: 52px; height: 52px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <h1 style="font-size: 1.7rem; color: var(--dark); font-weight: 800;">Patient Portal Login</h1>
                    <p style="color: var(--muted); font-size: 0.92rem; margin-top: 4px;">Sign in to access your appointment dashboard</p>
                </div>

                <div id="login-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 0.9rem;"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
                        </div>
                        <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <div style="margin-top: 24px;">
                        <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width: 100%;">
                            Sign In to Portal
                        </button>
                    </div>
                </form>

                <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--muted);">
                    Don't have an account? <a href="register.html" style="font-weight: 600;">Register here</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 MediPortal Healthcare System &bull; Patient Appointment Management</p>
        </div>
    </footer>

    <script src="js/notifications.js"></script>
    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect');
        const justRegistered = urlParams.get('registered');

        const alertBox = document.getElementById('login-alert');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');

        if (justRegistered) {
            showAlert('Registration completed successfully! Please log in with your email and password.', 'success');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying credentials...';

            try {
                const res = await API.post('/api/auth/login', { email, password });
                if (res.success) {
                    showToast(res.message || 'Login successful!', 'success');
                    setTimeout(() => {
                        if (redirectTarget) {
                            window.location.href = decodeURIComponent(redirectTarget);
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 600);
                }
            } catch (err) {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In to Portal';
                showAlert(err.message || 'Invalid email or password. Please try again.', 'danger');
            }
        });

        function showAlert(msg, type) {
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
            if (type === 'danger') {
                alertBox.style.background = 'var(--danger-light)';
                alertBox.style.color = 'var(--danger)';
                alertBox.style.border = '1px solid var(--danger)';
            } else {
                alertBox.style.background = 'var(--success-light)';
                alertBox.style.color = 'var(--success)';
                alertBox.style.border = '1px solid var(--success)';
            }
        }
    </script>
</body>
</html>

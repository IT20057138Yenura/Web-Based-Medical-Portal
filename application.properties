# Server Configuration
server.port=8080
server.servlet.context-path=/

# Session Management
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# MongoDB Connection
# Configured via MONGODB_URI environment variable with default fallback to user-supplied cloud cluster
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://it20057138_db_user:12345678910@cluster0.rc3mfar.mongodb.net/web_medical_portal?retryWrites=true&w=majority&appName=Cluster0}

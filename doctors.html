<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctors | MediPortal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 10.5V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4.5C5 15.2 8.8 19 13.5 19H14v2h-2a1 1 0 0 0 0 2h4a1 1 0 0 0 0-2h-1v-2h.5c4.7 0 8.5-3.8 8.5-8.5v-1a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v1c0 3.6-2.9 6.5-6.5 6.5S9 14.1 9 10.5V6h8v4.5a1 1 0 0 0 2 0z"/></svg>
                </div>
                <span>MediPortal</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="doctors.html" class="active">Find Doctors</a></li>
                <li class="protected-nav-link" style="display: none;"><a href="dashboard.html">Dashboard</a></li>
                <li class="protected-nav-link" style="display: none;"><a href="my-appointments.html">My Appointments</a></li>
                <li class="protected-nav-link" style="display: none;"><a href="profile.html">My Profile</a></li>
            </ul>

            <div class="auth-nav" id="navbar-auth-actions"></div>
        </div>
    </header>

    <!-- Page Content -->
    <main style="padding: 40px 0; flex-grow: 1;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 2rem; color: var(--dark); font-weight: 800;">Find a Medical Specialist</h1>
                    <p style="color: var(--muted); font-size: 1rem;">Browse verified doctors, check weekly availability, and schedule your visit.</p>
                </div>
                <div id="doctor-count-badge" class="badge badge-scheduled" style="font-size: 0.85rem; padding: 6px 14px;">Loading doctors...</div>
            </div>

            <!-- Search and Filter Bar -->
            <div class="card" style="padding: 20px; margin-bottom: 30px;">
                <div style="display: grid; grid-template-columns: 2fr 1.5fr auto; gap: 16px; align-items: end;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" for="search-input">Doctor Name</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Search by doctor name (e.g. Vance, Chen)...">
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" for="specialization-filter">Specialization</label>
                        <select id="specialization-filter" class="form-control">
                            <option value="">All Specializations</option>
                        </select>
                    </div>

                    <button id="reset-btn" class="btn btn-secondary" style="height: 44px;">Reset</button>
                </div>
            </div>

            <!-- Doctors Grid Container -->
            <div id="doctors-container" class="doctor-grid">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 MediPortal Healthcare System &bull; Patient Appointment Management</p>
        </div>
    </footer>

    <script src="js/notifications.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/doctors.js"></script>
</body>
</html>
